<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá khách hàng - Tự Do Cà Phê</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="feedback-container">
        <div class="header">
            <div class="logo-box">
                <span class="logo-text">TỰ <span class="star">★</span> DO</span>
                <span class="sub-logo">CÀ PHÊ</span>
            </div>
            <h2>Ý KIẾN KHÁCH HÀNG</h2>
        </div>

        <form class="feedback-form">
            <div class="rating-box">
                <p>Trải nghiệm của bạn như thế nào?</p>
                <div class="stars-input">
                    <span class="star-item active">★</span>
                    <span class="star-item active">★</span>
                    <span class="star-item active">★</span>
                    <span class="star-item active">★</span>
                    <span class="star-item">☆</span>
                </div>
            </div>

            <div class="input-field">
                <label>HỌ TÊN</label>
                <input type="text" placeholder="Hôm nay ai ghé Tự Do thế nhỉ?">
            </div>

            <div class="input-field">
                <label>LỜI NHẮN NHỦ</label>
                <textarea placeholder="Chia sẻ cảm nhận của bạn về đồ uống và không gian..."></textarea>
            </div>

            <button type="submit" class="submit-btn">GỬI PHẢN HỒI</button>
        </form>
    </div>

<script src="script.js"></script>

</body>
</html>
